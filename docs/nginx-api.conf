# /etc/nginx/sites-available/portfolio-api  (Laravel API + /admin)  →  ln -s to sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name api.yourdomain.com;
    root /var/www/portfolio-api/public;
    index index.php;

    client_max_body_size 210M;          # large video uploads (also raise upload_max_filesize / post_max_size in php.ini)

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ /\.(?!well-known) { deny all; }
}

# /etc/nginx/sites-available/portfolio-web  (React build = contents of frontend/dist)
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    root /var/www/portfolio-web;
    index index.html;
    location / { try_files $uri /index.html; }          # single-page-app fallback
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
# then:  sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com -d api.yourdomain.com
